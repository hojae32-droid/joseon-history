<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>조선 전기 인물과의 대화</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #F2EAD8;
    --paper-deep: #E7DBBF;
    --ink: #2B2420;
    --ink-soft: #5C5147;
    --red: #8B2E2E;
    --red-deep: #6E2222;
    --teal: #1F4E5F;
    --gold: #C99A3E;
    --card-bg: #FBF7EE;
    --line: rgba(43,36,32,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--paper);
    background-image:
      radial-gradient(circle at 20% 10%, rgba(201,154,62,0.08), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(31,78,95,0.07), transparent 45%);
    font-family:'Noto Sans KR', sans-serif;
    color: var(--ink);
    min-height:100vh;
  }
  .wrap{max-width: 980px; margin:0 auto; padding: 28px 20px 60px;}
  .site-head{ text-align:center; margin-bottom: 30px; }
  .site-head .kicker{
    font-size: 13px; color: var(--ink-soft); letter-spacing: 0.02em; margin-bottom: 6px;
  }
  .site-head h1{
    font-family:'Noto Serif KR', serif; font-weight:900;
    font-size: clamp(26px, 4.2vw, 38px);
    margin: 0 0 8px;
    color: var(--ink);
  }
  .site-head p{ margin:0; color: var(--ink-soft); font-size: 15px; }
  .scroll-row{
    display:grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 14px;
  }
  @media (max-width: 860px){
    .scroll-row{ grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 480px){
    .scroll-row{ grid-template-columns: 1fr; }
  }
  .figure-card{
    background: var(--card-bg);
    border: 1px solid var(--line);
    border-radius: 6px 6px 3px 3px;
    cursor:pointer;
    overflow:hidden;
    text-align:left;
    padding:0;
    display:flex; flex-direction:column;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    position:relative;
  }
  .figure-card:hover, .figure-card:focus-visible{
    transform: translateY(-4px);
    box-shadow: 0 10px 22px rgba(43,36,32,0.14);
    outline:none;
  }
  .figure-card .band{ height:6px; width:100%; }
  .figure-card .thumb{ width:100%; aspect-ratio: 220/300; background: var(--paper-deep); overflow:hidden; }
  .figure-card .thumb img{ width:100%; height:100%; object-fit: cover; display:block; }
  .figure-card .info{ padding: 12px 14px 16px; }
  .figure-card .name{ font-family:'Noto Serif KR', serif; font-weight:700; font-size: 17px; margin:0 0 4px; }
  .figure-card .era{ font-size: 12.5px; color: var(--ink-soft); margin:0; line-height:1.5; }
  #chatScreen{ display:none; }
  .back-btn{
    display:inline-flex; align-items:center; gap:6px;
    background:none; border:none; cursor:pointer;
    font-family:'Noto Sans KR', sans-serif; font-size: 14px; color: var(--ink-soft);
    padding: 6px 0; margin-bottom: 14px;
  }
  .back-btn:hover{ color: var(--ink); }
  .chat-stage{
    display:grid;
    grid-template-columns: 260px 1fr;
    gap: 18px;
    align-items:stretch;
  }
  @media (max-width: 720px){
    .chat-stage{ grid-template-columns: 1fr; }
  }
  .portrait-panel{
    background: var(--card-bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 18px 14px 14px;
    display:flex; flex-direction:column; align-items:center;
    position:relative;
  }
  .portrait-panel .band{ position:absolute; top:0; left:0; right:0; height:6px; border-radius:8px 8px 0 0;}
  .portrait-svg-wrap{ width: 100%; max-width: 210px; margin-top:6px; }

  /* ===== 초상화 사진 + 말하는 효과 ===== */
  .portrait-photo{
    position:relative; width:100%; aspect-ratio: 220/300;
    border-radius:5px; overflow:hidden;
    border:1px solid var(--line);
    box-shadow: 0 3px 10px rgba(43,36,32,0.12);
    transform-origin: 50% 88%;
    transition: box-shadow 0.3s ease;
  }
  .portrait-photo img{
    width:100%; height:100%; object-fit: cover; display:block;
    transform-origin: 50% 88%;
  }
  .portrait-photo .glow{
    position:absolute; inset:0; pointer-events:none;
    background: radial-gradient(circle at 50% 34%, rgba(255,230,170,0.55), transparent 58%);
    opacity:0; transition: opacity 0.35s ease;
  }
  /* 말하는 중: 고개를 까딱이며 말하는 듯한 미세한 움직임 */
  .portrait-panel.talking .portrait-photo img{
    animation: speakBob 0.62s ease-in-out infinite;
  }
  .portrait-panel.talking .portrait-photo{
    animation: speakSway 2.4s ease-in-out infinite;
    box-shadow: 0 6px 20px rgba(139,46,46,0.28);
  }
  .portrait-panel.talking .portrait-photo .glow{ opacity:1; animation: glowPulse 1.5s ease-in-out infinite; }
  @keyframes speakBob{
    0%   { transform: translateY(0)      scaleY(1)     scaleX(1); }
    45%  { transform: translateY(1.4px)  scaleY(1.012) scaleX(0.996); }
    100% { transform: translateY(0)      scaleY(1)     scaleX(1); }
  }
  @keyframes speakSway{
    0%   { transform: rotate(0deg)      translateX(0); }
    30%  { transform: rotate(-0.55deg)  translateX(-1.2px); }
    65%  { transform: rotate(0.55deg)   translateX(1.2px); }
    100% { transform: rotate(0deg)      translateX(0); }
  }
  @keyframes glowPulse{
    0%,100% { opacity:0.35; }
    50%     { opacity:0.8; }
  }
  /* 화면 움직임을 불편해하는 학생을 위한 배려 */
  @media (prefers-reduced-motion: reduce){
    .portrait-panel.talking .portrait-photo,
    .portrait-panel.talking .portrait-photo img{ animation:none; }
  }
  .portrait-name{ font-family:'Noto Serif KR', serif; font-weight:700; font-size: 18px; margin: 10px 0 2px; text-align:center;}
  .portrait-era{ font-size:12px; color:var(--ink-soft); text-align:center; margin:0 0 10px;}
  .portrait-note{ font-size: 11px; color: var(--ink-soft); opacity:0.75; text-align:center; margin-top:auto; padding-top:8px;}
  .speaking-tag{
    font-size: 12px; color: var(--red-deep); font-weight:500; height:16px; margin-bottom:4px;
    opacity:0; transition:opacity 0.2s;
  }
  .speaking-tag.on{ opacity:1; }
  .chat-panel{
    background: var(--card-bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    display:flex; flex-direction:column;
    min-height: 480px;
    max-height: 620px;
    overflow:hidden;
  }
  .chat-log{
    flex:1; overflow-y:auto; padding: 18px 18px 8px;
    display:flex; flex-direction:column; gap:12px;
  }
  .bubble{
    max-width: 82%;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 15px;
    line-height:1.55;
  }
  .bubble.figure{
    align-self:flex-start;
    background: var(--paper-deep);
    border: 1px solid var(--line);
    border-top-left-radius: 2px;
  }
  .bubble.user{
    align-self:flex-end;
    background: var(--teal);
    color: #fff;
    border-top-right-radius: 2px;
  }
  .bubble.loading{ color: var(--ink-soft); font-style:italic; }
  .chip-row{ display:flex; flex-wrap:wrap; gap:8px; padding: 4px 18px 14px; }
  .chip{
    font-size: 13px; background: transparent; border: 1px solid var(--line);
    color: var(--ink-soft); border-radius: 999px; padding: 7px 13px; cursor:pointer;
    transition: border-color 0.15s, color 0.15s;
  }
  .chip:hover{ border-color: var(--red); color: var(--red-deep); }
  .input-row{
    display:flex; gap:8px; align-items:center;
    border-top: 1px solid var(--line);
    padding: 12px 14px;
    background: var(--card-bg);
  }
  .input-row input[type=text]{
    flex:1; border:1px solid var(--line); border-radius:8px;
    padding: 11px 13px; font-size: 15px; font-family:inherit;
    background:#fff; color: var(--ink);
  }
  .input-row input[type=text]:focus{ outline:2px solid var(--teal); outline-offset:1px;}
  .mic-btn, .send-btn{
    border:none; border-radius:8px; cursor:pointer;
    width:44px; height:44px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-size:18px;
  }
  .mic-btn{ background: var(--paper-deep); color: var(--ink); border:1px solid var(--line); }
  .mic-btn.listening{ background: var(--red); color:#fff; }
  .mic-btn[disabled]{ opacity:0.35; cursor:not-allowed; }
  .send-btn{ background: var(--red); color:#fff; }
  .send-btn:hover{ background: var(--red-deep); }
  .mic-hint{ font-size: 11px; color: var(--ink-soft); padding: 0 14px 10px; text-align:right;}
  .voice-pick{ width:100%; margin-top:10px; }
  .voice-pick label{ display:block; font-size:11px; color:var(--ink-soft); margin-bottom:4px; }
  .voice-pick select{
    width:100%; font-family:inherit; font-size:12px; padding:6px 8px;
    border:1px solid var(--line); border-radius:6px; background:#fff; color:var(--ink);
  }
  .replay-btn{
    margin-top:8px; width:100%; font-family:inherit; font-size:12px; cursor:pointer;
    background:var(--paper-deep); border:1px solid var(--line); color:var(--ink);
    border-radius:6px; padding:7px 8px;
  }
  .replay-btn:hover{ border-color: var(--red); color: var(--red-deep); }
  ::-webkit-scrollbar{ width:8px; }
  ::-webkit-scrollbar-thumb{ background: var(--line); border-radius:4px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="site-head">
    <div class="kicker">조선 전기 인물 대화 학습</div>
    <h1>역사 인물에게 직접 물어보기</h1>
    <p>궁금한 인물을 선택하고, 글이나 음성으로 자유롭게 질문해 보세요.</p>
  </div>

  <div id="selectScreen">
    <div class="scroll-row" id="cardRow"></div>
  </div>

  <div id="chatScreen">
    <button class="back-btn" id="backBtn">← 인물 다시 선택하기</button>
    <div class="chat-stage">
      <div class="portrait-panel">
        <div class="band" id="portraitBand"></div>
        <div class="speaking-tag" id="speakingTag">말하는 중...</div>
        <div class="portrait-svg-wrap" id="portraitSvgWrap"></div>
        <div class="portrait-name" id="portraitName"></div>
        <div class="portrait-era" id="portraitEra"></div>
        <div class="voice-pick">
          <label for="voiceSelect">목소리 고르기</label>
          <select id="voiceSelect"></select>
        </div>
        <button class="replay-btn" id="replayBtn">🔊 마지막 말 다시 듣기</button>
        <div class="portrait-note">* 그림은 이해를 돕기 위한 간단한 일러스트예요</div>
      </div>

      <div class="chat-panel">
        <div class="chat-log" id="chatLog"></div>
        <div class="chip-row" id="chipRow"></div>
        <div class="input-row">
          <button class="mic-btn" id="micBtn" title="음성으로 질문하기">🎤</button>
          <input type="text" id="textInput" placeholder="궁금한 것을 물어보세요..." autocomplete="off">
          <button class="send-btn" id="sendBtn" title="보내기">➤</button>
        </div>
        <div class="mic-hint" id="micHint"></div>
      </div>
    </div>
  </div>
</div>

    facts: '고려 말 무신 출신 장군으로 여러 전투에서 큰 공을 세움. 1388년 위화도 회군으로 정권을 장악함. 1392년 새 나라 조선을 세우고 첫 임금이 됨. 도읍을 한양(지금의 서울)으로 정함. 아들들 사이의 왕위 다툼(왕자의 난)으로 상심하여 말년에 함흥으로 떠남.',
  },
  {
    id: 'sejong',
    name: '세종대왕',
    era: '한글을 만든 조선의 4대 임금 (1397~1450)',
    band: '#2E6579',
    greeting: '안녕하세요, 나는 조선의 4대 임금 세종이에요. 백성을 위해 한글을 만들었지요. 궁금한 것이 있으면 무엇이든 물어보세요!',
    chips: ["한글은 왜 만드셨나요?", "가장 자랑스러운 발명품은 무엇인가요?", "백성들을 위해 어떤 일을 하셨나요?"],
    facts: '1418년부터 1450년까지 조선의 4대 임금으로 재위함. 백성들이 쉽게 글을 배울 수 있도록 훈민정음(한글)을 만들어 1446년에 반포함. 집현전을 설치해 학자들을 길러냄. 장영실을 등용해 측우기, 앙부일구, 자격루 같은 과학 기구를 만들게 함.',
  },
  {
    id: 'jangyeongsil',
    name: '장영실',
    era: '노비 출신의 천재 과학자',
    band: '#4C8571',
    greeting: '안녕! 나는 조선의 과학자 장영실이야. 자격루, 측우기 같은 발명품을 만들었지. 과학 이야기가 궁금하면 물어봐!',
    chips: ["어떻게 노비 출신에서 과학자가 되셨나요?", "자격루는 어떤 원리로 움직이나요?", "가장 만들기 어려웠던 발명품은 무엇인가요?"],
    facts: '동래현 관노 출신으로 태어남. 손재주와 기술이 뛰어나 세종의 눈에 띄어 관직에 등용됨. 자격루, 앙부일구, 측우기 등을 만드는 데 큰 역할을 함.',
  },
  {
    id: 'yisunsin',
    name: '이순신',
    era: '왜적으로부터 바다를 지킨 명장 (1545~1598)',
    band: '#334F66',
    greeting: '안녕? 나는 바다를 지킨 장군 이순신이다. 왜적으로부터 우리 바다를 지키기 위해 싸웠던 이야기가 궁금하지 않니?',
    chips: ["거북선은 어떻게 만들어졌나요?", "열두 척의 배로 어떻게 명량대첩에서 승리하셨나요?", "가장 힘들었던 전투는 무엇이었나요?"],

  },
  {
    id: 'seongjong',
    name: '성종',
    era: '법전을 완성하고 문물을 정비한 9대 임금 (1457~1494)',
    band: '#6E4E82',
    greeting: '안녕한가, 나는 조선의 아홉 번째 임금 성종이라 하네. 나라의 법과 제도를 정리하고 학문을 일으키는 데 힘썼지.',
    chips: ["경국대전은 왜 만드셨나요?", "홍문관에서는 어떤 일을 했나요?", "조선을 다스리며 가장 신경 쓴 일은 무엇인가요?"],
    facts: '조선 9대 임금. 경국대전 완성, 홍문관 설치, 사림파 학자 등용, 동국여지승람과 동국통감 등 편찬.',
  }

const SYSTEM_PROMPT_TEMPLATE = (figure) => `너는 조선 전기의 역사 인물 "${figure.name}"이다. 초등학교 5학년 학생과 대화 중이다.
규칙:
1. "${figure.name}" 1인칭 시점으로 대답할 것.
2. 초등학생 눈높이에 맞춰 다정하고 쉽게 3~4문장으로 대답할 것.
3. 어려운 한자어나 옛 관직명이 나오면 쉬운 말로 바로 풀어 설명할 것.
4. 이모지나 특수문자, 마크다운은 사용하지 말 것.

[인물 정보]
${figure.facts}`;

let currentFigure = null;
let chatHistories = {};
let voices = [];

const cardRow = document.getElementById('cardRow');
const selectScreen = document.getElementById('selectScreen');
const chatScreen = document.getElementById('chatScreen');
const backBtn = document.getElementById('backBtn');
const portraitBand = document.getElementById('portraitBand');
const portraitSvgWrap = document.getElementById('portraitSvgWrap');
const portraitName = document.getElementById('portraitName');
const portraitEra = document.getElementById('portraitEra');
const speakingTag = document.getElementById('speakingTag');
const chatLog = document.getElementById('chatLog');
const chipRow = document.getElementById('chipRow');
const textInput = document.getElementById('textInput');
const sendBtn = document.getElementById('sendBtn');
const micBtn = document.getElementById('micBtn');
const micHint = document.getElementById('micHint');

FIGURES.forEach(f => {
  const card = document.createElement('button');
  card.className = 'figure-card';
  card.innerHTML = `
    <div class="band" style="background:${f.band}"></div>
    <div class="thumb"><img src="${PORTRAITS[f.id]}" alt="${f.name} 초상화"></div>
    <div class="info">
      <p class="name">${f.name}</p>
      <p class="era">${f.era}</p>
    </div>`;
  card.addEventListener('click', () => openChat(f));
  cardRow.appendChild(card);
});

function openChat(figure){
  currentFigure = figure;
  selectScreen.style.display = 'none';
  chatScreen.style.display = 'block';
  portraitBand.style.background = figure.band;
  portraitSvgWrap.innerHTML = `<div class="portrait-photo"><img src="${PORTRAITS[figure.id]}" alt="${figure.name} 초상화"><span class="glow"></span></div>`;
  portraitName.textContent = figure.name;
  portraitEra.textContent = figure.era;
  chatLog.innerHTML = '';
  chipRow.innerHTML = '';
  figure.chips.forEach(q => {
    const chip = document.createElement('button');
    chip.className = 'chip';
    chip.textContent = q;
    chip.addEventListener('click', () => sendMessage(q));
    chipRow.appendChild(chip);
  });
  if(!chatHistories[figure.id]){
    chatHistories[figure.id] = [];
    addBubble('figure', figure.greeting);
    speakText(figure.greeting);
    chatHistories[figure.id].push({role:'assistant', content: figure.greeting});
  } else {
    chatHistories[figure.id].forEach(m => addBubble(m.role === 'user' ? 'user' : 'figure', m.content));
  }
  textInput.value = '';
  textInput.focus();
}

backBtn.addEventListener('click', () => {
  window.speechSynthesis.cancel();
  chatScreen.style.display = 'none';
  selectScreen.style.display = 'block';
  currentFigure = null;
});

function addBubble(role, text, isLoading){
  const b = document.createElement('div');
  b.className = 'bubble ' + (role === 'user' ? 'user' : 'figure') + (isLoading ? ' loading' : '');
  b.textContent = text;
  chatLog.appendChild(b);
  chatLog.scrollTop = chatLog.scrollHeight;
  return b;
}

async function sendMessage(presetText){
  const text = (presetText !== undefined ? presetText : textInput.value).trim();
  if(!text || !currentFigure) return;
  textInput.value = '';
  addBubble('user', text);
  chatHistories[currentFigure.id].push({role:'user', content: text});
  const loadingBubble = addBubble('figure', '생각하는 중...', true);
  try{
    const reply = await askFigure(currentFigure, chatHistories[currentFigure.id]);
    loadingBubble.remove();
    addBubble('figure', reply);
    chatHistories[currentFigure.id].push({role:'assistant', content: reply});
    speakText(reply);
  }catch(err){
    loadingBubble.remove();
    addBubble('figure', '대답을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요. (원인: ' + (err && err.message ? err.message : err) + ')');
    console.error('Groq API 오류 상세:', err);
  }
}

sendBtn.addEventListener('click', () => sendMessage());
textInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') sendMessage(); });

// =========================================================
// Groq API 호출 (OpenAI 호환 형식)
// =========================================================
async function askFigure(figure, history){
  const messages = [
    { role: 'system', content: SYSTEM_PROMPT_TEMPLATE(figure) },
    ...history.slice(-8).map(m => ({ role: m.role, content: m.content }))
  ];

  const response = await fetch('/.netlify/functions/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ messages: messages })
  });

  const data = await response.json();

  if(!response.ok || data.error){
    throw new Error(data.error ? data.error.message : 'API 오류');
  }

  if(data.choices && data.choices[0] && data.choices[0].message){
    return data.choices[0].message.content.trim();
  }

  throw new Error('응답 데이터를 찾을 수 없습니다.');
}

// =========================================================
// 음성 출력 (남성 목소리 우선 선택)
// =========================================================
const voiceSelect = document.getElementById('voiceSelect');
const replayBtn = document.getElementById('replayBtn');

// 한국어 남성 목소리로 알려진 이름들 (윈도우/엣지/맥/안드로이드)
const MALE_HINTS = ['injoon','인준','hyunsu','현수','bongjin','봉진','gookmin','국민',
                    'yuseok','유석','minsu','민수','male','남성','ko-kr-standard-c',
                    'ko-kr-standard-d','ko-kr-wavenet-c','ko-kr-wavenet-d'];
const FEMALE_HINTS = ['heami','혜미','sunhi','선히','yuna','유나','jimin','지민',
                      'seohyeon','서현','yujin','유진','female','여성'];

let koVoices = [];
let chosenVoice = null;
let lastSpokenText = '';

function scoreVoice(v){
  const n = (v.name + ' ' + (v.voiceURI||'')).toLowerCase();
  let score = 0;
  if(MALE_HINTS.some(h => n.includes(h))) score += 100;   // 남성 목소리 최우선
  if(FEMALE_HINTS.some(h => n.includes(h))) score -= 50;  // 여성 목소리 후순위
  if(n.includes('natural') || n.includes('neural') || n.includes('online')) score += 30; // 자연스러운 신경망 음성
  if(!v.localService) score += 10;
  return score;
}

function loadVoices(){
  if(!window.speechSynthesis) return;
  voices = window.speechSynthesis.getVoices() || [];
  koVoices = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith('ko'))
                   .sort((a,b) => scoreVoice(b) - scoreVoice(a));

  const prev = chosenVoice ? chosenVoice.name : null;
  voiceSelect.innerHTML = '';
  if(koVoices.length === 0){
    const opt = document.createElement('option');
    opt.textContent = '사용 가능한 한국어 목소리가 없어요';
    voiceSelect.appendChild(opt);
    voiceSelect.disabled = true;
    return;
  }
  voiceSelect.disabled = false;
  koVoices.forEach((v, i) => {
    const opt = document.createElement('option');
    opt.value = v.name;
    const tag = MALE_HINTS.some(h => v.name.toLowerCase().includes(h)) ? ' (남성)'
              : FEMALE_HINTS.some(h => v.name.toLowerCase().includes(h)) ? ' (여성)' : '';
    opt.textContent = v.name + tag;
    voiceSelect.appendChild(opt);
  });
  chosenVoice = koVoices.find(v => v.name === prev) || koVoices[0];
  voiceSelect.value = chosenVoice.name;
}

if(window.speechSynthesis){
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
}

voiceSelect.addEventListener('change', () => {
  chosenVoice = koVoices.find(v => v.name === voiceSelect.value) || chosenVoice;
  window.speechSynthesis.cancel();
  speakText('그래, 이제 이 목소리로 이야기하마.');
});

replayBtn.addEventListener('click', () => {
  if(lastSpokenText) speakText(lastSpokenText);
});

// 문장 단위로 끊어 읽어 기계음 느낌을 줄임
function splitSentences(text){
  return text.split(/(?<=[.!?。…])\s+|(?<=[다요죠네까])\.\s*/)
             .map(t => t.trim()).filter(Boolean);
}

function speakText(text){
  if(!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  lastSpokenText = text;

  const panel = document.querySelector('.portrait-panel');
  const isMaleVoice = chosenVoice && MALE_HINTS.some(h => chosenVoice.name.toLowerCase().includes(h));
  // 남성 목소리가 없는 기기에서는 음높이를 낮춰 남성적으로 들리게 보정
  const pitch = isMaleVoice ? 0.95 : 0.6;
  const rate  = 0.92;   // 살짝 느리게 읽어 또박또박 들리게

  const parts = splitSentences(text);
  if(parts.length === 0) return;

  parts.forEach((part, idx) => {
    const utter = new SpeechSynthesisUtterance(part);
    if(chosenVoice) utter.voice = chosenVoice;
    utter.lang = 'ko-KR';
    utter.rate = rate;
    utter.pitch = pitch;
    utter.volume = 1;
    if(idx === 0){
      utter.onstart = () => { panel.classList.add('talking'); speakingTag.classList.add('on'); };
    }
    if(idx === parts.length - 1){
      utter.onend = () => { panel.classList.remove('talking'); speakingTag.classList.remove('on'); };
    }
    utter.onerror = () => { panel.classList.remove('talking'); speakingTag.classList.remove('on'); };
    window.speechSynthesis.speak(utter);
  });
}

const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
if(SpeechRecognitionAPI){
  const recognition = new SpeechRecognitionAPI();
  recognition.lang = 'ko-KR';
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;
  let isListening = false;
  recognition.onresult = (e) => {
    const said = e.results[0][0].transcript;
    textInput.value = said;
    sendMessage(said);
  };
  recognition.onend = () => { isListening = false; micBtn.classList.remove('listening'); };
  recognition.onerror = () => { isListening = false; micBtn.classList.remove('listening'); };
  micBtn.addEventListener('click', () => {
    if(isListening){ recognition.stop(); return; }
    try{
      recognition.start();
      isListening = true;
      micBtn.classList.add('listening');
    }catch(err){ console.error(err); }
  });
  micHint.textContent = '마이크 버튼을 누르고 말하면 글자로 바뀌어요';
}else{
  micBtn.disabled = true;
  micHint.textContent = '이 브라우저에서는 음성 인식이 지원되지 않아요. 글자로 입력해 주세요.';
}
